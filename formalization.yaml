    authors:
      - "Paul Erdős"
      - "Robin J. Wilson"
    id: "doi:10.1016/0095-8956(77)90039-9"
    type: "paper"
    location: "Journal of Combinatorial Theory, Series B 23 (1977), no. 2-3, 255–257"
    relationship: "formalizes"
    note: >-
      The theorem that almost all graphs are of class one, via the unique vertex of maximum
      degree. The formalized probabilistic argument is a standard second-moment proof with an
      adaptively chosen degree threshold, not necessarily the article's computation. The
      formalization is by a different author; the article's authors were not involved.
    license: "all rights reserved"
    author_endorsement: "not-contacted"

