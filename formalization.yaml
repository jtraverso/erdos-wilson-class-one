status:
  scope: >-
    The Erdős–Wilson theorem as a limit statement, the unique-maximum-degree statement it rests
    on, and the deterministic step. Not formalized: rates of convergence; the model G(n, p) for
    p ≠ 1/2.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
