version: "v0.4"

project:
  name: "Erdős–Wilson: almost every graph is of class one"
  description: >-
    A Lean 4 / Mathlib proof of the theorem of Erdős and Wilson (1977) that almost every graph is
    of class one: among the 2^C(n,2) labelled graphs on Fin n, the proportion whose line graph is
    Δ(G)-colourable tends to 1 (erdos_wilson). On the way it proves that almost every graph has a
    unique vertex of maximum degree (tendsto_unique_maxDegree) and that a graph with at most one
    vertex of maximum degree is of class one (colorable_of_subsingleton_maxDegree, the special
    case of Fournier's theorem imported from PALOMAR-2026-11-08-000009). The probabilistic part is
    a second-moment argument with explicit binomial estimates: with X the number of vertices of
    degree at least a threshold k, P(X = 0) ≤ 1/(n tl_k) + bp_{k-1}^2/(4 tl_k^2) and P(two distinct
    vertices of equal degree ≥ k) ≤ n^2 Σ_{i ≥ k-1} bp_i^2, where bp, tl are the point
    probabilities and upper tails of Bin(n-2, 1/2); the joint law of two degrees is computed
    exactly by a symmetric-difference (translation) argument on the set of graphs, and k is chosen
    adaptively. Only qualitative statements (limits) are stated; no rate of convergence is
    claimed. Three statements; no definitions beyond Mathlib's.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C15", "05C80"]

repository:
  role: "substantive-development"

sources:
