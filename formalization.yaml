      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Wrote the Lean development (ErdosWilson/*.lean), the Challenge/Solution pair and the
        packaging under the author's direction, checked with lean against the pinned dependencies,
        #print axioms and a comparison of the elaborated Challenge and Solution statements (pp.all)
        (Lean v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean development is AI-written under the
    author's direction and mechanically verified: no sorry, axioms limited to propext,
    Classical.choice and Quot.sound, identical elaborated statements in the Challenge and the
    Solution.

fidelity:
  divergences: >-
    "Almost every graph" is the uniform measure on the 2^C(n,2) simple graphs on Fin n, written as
    the ratio (#{G : SimpleGraph (Fin n) | P G} : ℝ) / 2 ^ n.choose 2. Class one is stated as
    Δ(G)-colourability of the line graph (Mathlib's lineGraph, Colorable, maxDegree); decidability
    is classical. Unique maximum degree is ∃! v, G.degree v = G.maxDegree.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification. Small cases were
    checked by brute force (n ≤ 6: the proportion of class-one graphs is 1, 1, 1, 7/8, 15/16,
    0.929, 0.975; every graph with a unique vertex of maximum degree is class one; the proportion
    with a unique maximum is 0, 1, 0, 0.375, 0.4375, 0.513, 0.530), and the explicit tie bound was
    evaluated numerically (about 0.67 at n = 10^4, 0.32 at 10^6, 0.22 at 10^7, decreasing to 0).
    No independent human review has been performed. The result is classical; no mathematical
    novelty is claimed.

alignment:
  namespace: "ErdosWilson"
  statements:
