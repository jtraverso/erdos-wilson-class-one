    - {source: "Almost every graph has a unique vertex of maximum degree", lean: "ErdosWilson.tendsto_unique_maxDegree", module: "ErdosWilsonChallenge", status: "proved"}
    - {source: "Erdős–Wilson 1977: almost every graph is of class one", lean: "ErdosWilson.erdos_wilson", module: "ErdosWilsonChallenge", status: "proved"}

